name: AntiJam Core 0.1.2 CI Verify

on:
  workflow_dispatch:
  push:
    branches: [ "antijam-core-0.1.2-ci" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified 0.1.1 source
        run: |
          cat antijam-ci-parts/part*.txt | base64 -d > antijam-core.zip
          echo "e85f213382b34be7815fb8e44b0785d95440754b167aea61bf1d87f4544a6067  antijam-core.zip" | sha256sum -c -
          rm -rf antijam-core
          mkdir antijam-core
          unzip -q antijam-core.zip -d antijam-core

      - name: Apply 0.1.2 sharing overlay
        run: |
          cp -a antijam-012-overlay/app/. antijam-core/app/
          grep -q 'versionName = "0.1.2"' antijam-core/app/build.gradle.kts
          grep -q 'НАДІСЛАТИ В CHATGPT' antijam-core/app/src/main/java/com/antijam/nav/core/MainActivity.kt
          grep -q 'TripFileProvider' antijam-core/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        working-directory: antijam-core
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: antijam-core
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          test -s antijam-core/app/build/outputs/apk/debug/app-debug.apk
          unzip -t antijam-core/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum antijam-core/app/build/outputs/apk/debug/app-debug.apk

      - name: Package verified source
        run: |
          cd antijam-core
          zip -qr ../AntiJamNav-Core-0.1.2-source.zip . -x '*/build/*' '.gradle/*'
          cd ..
          sha256sum AntiJamNav-Core-0.1.2-source.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiJamNav-Core-0.1.2-debug
          path: antijam-core/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: AntiJamNav-Core-0.1.2-source
          path: AntiJamNav-Core-0.1.2-source.zip
