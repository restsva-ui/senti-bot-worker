name: RemindIt Android Beta

on:
  push:
    branches:
      - remindit-mvp
    paths:
      - 'remindit/**'
      - '.github/workflows/remindit-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p remindit :app:assembleDebug --stacktrace

      - name: Build debug AAB
        run: gradle -p remindit :app:bundleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemindIt-Beta-0.8-APK
          path: remindit/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: RemindIt-Beta-0.8-AAB
          path: remindit/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
