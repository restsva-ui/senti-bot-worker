plugins {
    id 'com.android.application'
}

def betaKeystorePath = System.getenv('REMINDIT_KEYSTORE_PATH')

android {
    namespace 'com.remindit.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.remindit.app'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '0.9.0'
    }

    signingConfigs {
        beta {
            if (betaKeystorePath) {
                storeFile file(betaKeystorePath)
                storePassword System.getenv('REMINDIT_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('REMINDIT_KEY_ALIAS') ?: 'remindit-beta'
                keyPassword System.getenv('REMINDIT_KEY_PASSWORD') ?: 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (betaKeystorePath) signingConfig signingConfigs.beta
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (betaKeystorePath) signingConfig signingConfigs.beta
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

def ocrDir = file('src/main/assets/tessdata')
def ocrLanguages = ['ukr', 'rus', 'eng']
def ocrModelRevision = '87416418657359cb625c412a48b6e1d6d41c29bd'

tasks.register('prepareOcrAssets') {
    outputs.dir(ocrDir)
    doLast {
        ocrDir.mkdirs()
        ocrLanguages.each { lang ->
            def model = new File(ocrDir, "${lang}.traineddata")
            if (!model.exists() || model.length() < 500000L) {
                def modelUrl = new URL("https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/${ocrModelRevision}/${lang}.traineddata")
                modelUrl.withInputStream { input ->
                    model.withOutputStream { output -> output << input }
                }
            }
            if (!model.exists() || model.length() < 500000L) {
                throw new GradleException("OCR model ${lang} was not prepared correctly")
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('prepareOcrAssets'))
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    testImplementation 'junit:junit:4.13.2'
}
