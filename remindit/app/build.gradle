plugins {
    id 'com.android.application'
}

android {
    namespace 'com.remindit.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.remindit.app'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.8.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

def ocrDir = file('src/main/assets/tessdata')
def ocrLanguages = ['ukr', 'rus', 'eng']

tasks.register('prepareOcrAssets') {
    outputs.dir(ocrDir)
    doLast {
        ocrDir.mkdirs()
        ocrLanguages.each { lang ->
            def model = new File(ocrDir, "${lang}.traineddata")
            if (!model.exists() || model.length() < 500000L) {
                def modelUrl = new URL("https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/${lang}.traineddata")
                modelUrl.withInputStream { input ->
                    model.withOutputStream { output -> output << input }
                }
            }
            if (!model.exists() || model.length() < 500000L) {
                throw new GradleException("OCR model ${lang} was not prepared correctly")
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('prepareOcrAssets'))
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}
