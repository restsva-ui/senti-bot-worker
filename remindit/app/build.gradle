plugins {
    id 'com.android.application'
}

android {
    namespace 'com.remindit.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.remindit.app'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.7.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

def ukrOcrModel = file('src/main/assets/tessdata/ukr.traineddata')

tasks.register('prepareUkrOcrAsset') {
    outputs.file(ukrOcrModel)
    doLast {
        if (!ukrOcrModel.exists() || ukrOcrModel.length() < 1000000L) {
            ukrOcrModel.parentFile.mkdirs()
            def modelUrl = new URL('https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ukr.traineddata')
            modelUrl.withInputStream { input ->
                ukrOcrModel.withOutputStream { output -> output << input }
            }
        }
        if (!ukrOcrModel.exists() || ukrOcrModel.length() < 1000000L) {
            throw new GradleException('Ukrainian OCR model was not prepared correctly')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('prepareUkrOcrAsset'))
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}
