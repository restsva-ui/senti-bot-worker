name = "senti-bot-worker"
main = "src/index.js"
compatibility_date = "2024-09-25"
account_id = "2cf6e316af8623546c95c0354bc3aa00"
workers_dev = true

[ai]
binding = "AI"

# Secrets must be configured with `wrangler secret put` and must never be committed:
# BOT_TOKEN / TELEGRAM_BOT_TOKEN
# TG_WEBHOOK_SECRET
# WEBHOOK_SECRET
# ADMIN_SECRET
# GEMINI_API_KEY
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET

[triggers]
crons = [
  "*/15 * * * *",
  "0 * * * *",
  "10 2 * * *"
]

[vars]
SERVICE_HOST = "https://senti-bot-worker.restsva.workers.dev"
DRIVE_FOLDER_ID = "root"
TELEGRAM_ADMIN_ID = "784869835"
DEPLOY_ID = "local-dev"
LEARN_ENABLED = "on"
CF_ACCOUNT_ID = "2cf6e316af8623546c95c0354bc3aa00"
ALLOW_PUBLIC_REPO = "off"
ALLOW_PUBLIC_STATUT = "off"
ALLOW_PUBLIC_CHECKLIST = "off"
TIMEZONE = "Europe/Kyiv"
DIAG_TAGS = "on"
MAP_LINK_STYLE = "arrow"
TELEGRAM_PARSE_MODE = "HTML"

MODEL_ORDER = "gemini:gemini-2.5-flash, gemini:gemini-1.5-flash-latest, cf:@cf/meta/llama-3.1-8b-instruct"
MODEL_ORDER_TEXT = "gemini:gemini-2.5-flash, gemini:gemini-1.5-flash-latest, cf:@cf/meta/llama-3.1-8b-instruct"
MODEL_ORDER_CODE = "cf:@cf/meta/llama-3.1-8b-instruct, gemini:gemini-1.5-flash-latest"
MODEL_ORDER_VISION = "gemini:gemini-2.5-flash-lite, gemini:gemini-1.5-flash-latest, cf:@cf/meta/llama-3.2-11b-vision-instruct"
GEMINI_MODEL = "gemini-2.5-flash"
CF_MODEL = "@cf/meta/llama-3.1-8b-instruct"
CF_VISION_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"

AUTO_IMPROVE = "on"
NIGHTLY_UTC_HOUR = "23"
SELF_REGULATE = "on"
SELF_TUNING_FACTOR = "0.3"

ENERGY_MAX = "100"
ENERGY_RECOVER_PER_MIN = "1"
ENERGY_COST_TEXT = "1"
ENERGY_COST_IMAGE = "5"
ENERGY_LOW_THRESHOLD = "10"

[[kv_namespaces]]
binding = "DEDUP_KV"
id = "20d81d7b68fa4ac6b9913e2fbd3465d5"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "e2a8d3941b4e41728318781e739a4d47"

[[kv_namespaces]]
binding = "STATE_KV"
id = "7b32e2d1f60846ddb1c653eb52180bf7"

[[kv_namespaces]]
binding = "TODO_KV"
id = "497eac980691495ea2a0bc8611892d65"

[[kv_namespaces]]
binding = "USER_OAUTH_KV"
id = "470d4f5c164a4a828c569eb9a52a5133"

# CHECKLIST_KV currently shares storage with TODO_KV. Split these namespaces when migrating data.
[[kv_namespaces]]
binding = "CHECKLIST_KV"
id = "497eac980691495ea2a0bc8611892d65"

[[kv_namespaces]]
binding = "LIKES_KV"
id = "f7d480c281ad47d2bdf270fadf4de021"

[[kv_namespaces]]
binding = "ENERGY_LOG_KV"
id = "9e6f0ed5bf2544a9a63d57455900a844"

[[kv_namespaces]]
binding = "LEARN_QUEUE_KV"
id = "86a54c59ce674a558780c58bf1a47dfd"

[[r2_buckets]]
binding = "LEARN_BUCKET"
bucket_name = "senti-learn"

[[r2_buckets]]
binding = "REPO_BUCKET"
bucket_name = "senti-repo"
